<!DOCTYPE html>
<html>
<head>
<title>Character Limit Checker</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  margin-top:40px;
}

textarea{
  width:300px;
  height:120px;
  padding:10px;
}

p{
  font-weight:bold;
}
</style>

</head>

<body>

<h2>Character Limit Checker</h2>

<textarea id="textBox" placeholder="Type here..." ></textarea>

<p id="count">Remaining: 200</p>

<script>

let max = 200;

document.getElementById("textBox").addEventListener("input", function(){

let text = this.value;

if(text.length > max){
    this.value = text.substring(0,max);
}

let remaining = max - this.value.length;

document.getElementById("count").innerText =
"Remaining: " + remaining;

});

</script>

</body>
</html>
