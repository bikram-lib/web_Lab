<!DOCTYPE html>
<html>
<head>
    <title>Calculator with History</title>
    <style>
        body{
            text-align:center;
            margin-top:40px;
            font-family:Arial;
        }
        input, button{
            padding:8px;
            margin:5px;
        }
        #history{
            margin-top:20px;
        }
        li{
            list-style:none;
        }
    </style>
</head>
<body>

<h2>Simple Calculator</h2>

<input type="number" id="num1" placeholder="First Number">
<input type="number" id="num2" placeholder="Second Number">
<br>

<button onclick="calculate('+')">+</button>
<button onclick="calculate('-')">-</button>
<button onclick="calculate('*')">×</button>
<button onclick="calculate('/')">÷</button>

<h3 id="result"></h3>

<div id="history">
    <h3>Last 5 Calculations</h3>
    <ul id="historyList"></ul>
</div>

<script>

let historyArray = [];
function reset(){
    // Reset input fields
document.getElementById("num1").value = "";
document.getElementById("num2").value = "";

}

function calculate(operator) {

    let n1 = parseFloat(document.getElementById("num1").value);
    let n2 = parseFloat(document.getElementById("num2").value);
    let result;

    if(operator === "+") {
        result = n1 + n2;reset();
    }
    else if(operator === "-") {
        result = n1 - n2;reset();
    }
    else if(operator === "*") {
        result = n1 * n2;reset();
    }
    else if(operator === "/") {
        if(n2 === 0) {
            document.getElementById("result").innerHTML = "Cannot divide by zero";reset();
            return;
        }
        result = n1 / n2;
        reset();
    }

    document.getElementById("result").innerHTML = "Result: " + result;

    // Store calculation in array
    let calculation = n1 + " " + operator + " " + n2 + " = " + result;
    historyArray.push(calculation);

    // Keep only last 5 records
    if(historyArray.length > 5) {
        historyArray.shift();
    }

    updateHistory();
}

function updateHistory() {

    let list = document.getElementById("historyList");
    list.innerHTML = "";

    historyArray.forEach(function(item){
        let li = document.createElement("li");
        li.innerHTML = item;
        list.appendChild(li);
    });
}

</script>

</body>
</html>
