<!DOCTYPE html>
<html>
<head>
    <title>OTP Generator</title>
    <style>
        body{
            text-align:center;
            margin-top:50px;
            font-family:Arial;
        }
        input, button{
            padding:8px;
            margin:5px;
        }
        #message{
            font-weight:bold;
        }
    </style>
</head>
<body>

    <h2>OTP Generator & Verification</h2>

    <button onclick="generateOTP()">Generate OTP</button>
    <p id="displayOTP"></p>

    <input type="text" id="userOTP" placeholder="Enter OTP">
    <button onclick="verifyOTP()">Verify OTP</button>

    <p id="message"></p>

<script>
    let generatedOTP = "";

    function generateOTP() {
        generatedOTP = Math.floor(100000 + Math.random() * 900000);
        document.getElementById("displayOTP").innerHTML = 
            "Generated OTP: " + generatedOTP;
        document.getElementById("message").innerHTML = "";
    }

    function verifyOTP() {
        let userInput = document.getElementById("userOTP").value;

        if(userInput === generatedOTP.toString()) {
            document.getElementById("message").innerHTML = "Valid OTP";
            document.getElementById("message").style.color = "green";
        } else {
            document.getElementById("message").innerHTML = "Invalid OTP";
            document.getElementById("message").style.color = "red";
        }
    }
</script>

</body>
</html>
